<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If We Could Meet</title>
    <style>
        :root {
            --bg: #1a1a2e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        #game-container {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(255, 180, 100, 0.3), 0 0 120px rgba(255, 140, 60, 0.15);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js">
    </script>
    <script>
        // ──────────────────────────────────────────────
        //  MUSIC MANAGER – Simple procedural ambient tones
        // ──────────────────────────────────────────────
        class MusicManager {
            constructor() {
                this.ctx = null;
                this.gainNode = null;
                this.activeOscillators = [];
                this.isPlaying = false;
                this.currentMood = 'warm';
                this.volume = 0.25;
                this.init();
            }

            init() {
                try {
                    this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                    this.gainNode = this.ctx.createGain();
                    this.gainNode.gain.value = this.volume;
                    this.gainNode.connect(this.ctx.destination);
                } catch (e) {
                    console.log('Audio not available');
                }
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            stopAll() {
                this.activeOscillators.forEach(osc => {
                    try { osc.stop(); } catch (e) {}
                });
                this.activeOscillators = [];
                this.isPlaying = false;
            }

            playNote(freq, duration, type = 'sine', vol = 0.18, delay = 0) {
                if (!this.ctx || !this.gainNode) return;
                this.resume();
                const now = this.ctx.currentTime + delay;
                const osc = this.ctx.createOscillator();
                const noteGain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                noteGain.gain.setValueAtTime(0, now);
                noteGain.gain.linearRampToValueAtTime(vol, now + 0.08);
                noteGain.gain.linearRampToValueAtTime(vol * 0.7, now + duration * 0.6);
                noteGain.gain.linearRampToValueAtTime(0, now + duration);
                osc.connect(noteGain);
                noteGain.connect(this.gainNode);
                osc.start(now);
                osc.stop(now + duration + 0.05);
                this.activeOscillators.push(osc);
                // Clean up
                setTimeout(() => {
                    const idx = this.activeOscillators.indexOf(osc);
                    if (idx > -1) this.activeOscillators.splice(idx, 1);
                }, (duration + delay + 0.1) * 1000);
            }

            playChord(notes, duration, type = 'sine', vol = 0.12, delay = 0) {
                notes.forEach(freq => this.playNote(freq, duration, type, vol, delay));
            }

            // Warm piano-like melody
            playWarmMelody() {
                this.currentMood = 'warm';
                const melody = [
                    [261.63, 0.8],
                    [329.63, 0.7],
                    [392.00, 0.9],
                    [329.63, 0.6],
                    [349.23, 0.7],
                    [293.66, 0.8],
                    [261.63, 0.9],
                    [220.00, 0.7],
                ];
                const chordNotes = [
                    [261.63, 329.63, 392.00],
                    [293.66, 349.23, 440.00],
                    [261.63, 329.63, 392.00],
                    [220.00, 293.66, 349.23],
                ];

                let time = 0;
                const loop = () => {
                    if (!this.isPlaying || this.currentMood !== 'warm') return;
                    const chordIdx = Math.floor(time / 3.2) % chordNotes.length;
                    this.playChord(chordNotes[chordIdx], 3.0, 'sine', 0.07, 0);
                    const noteIdx = time % melody.length;
                    this.playNote(melody[noteIdx][0], melody[noteIdx][1], 'triangle', 0.14, 0.15);
                    time++;
                    this._warmTimeout = setTimeout(loop, 1100 + Math.random() * 400);
                };
                loop();
            }

            playSoftMelody() {
                this.currentMood = 'soft';
                const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 349.23, 329.63, 293.66];
                let i = 0;
                const loop = () => {
                    if (!this.isPlaying || this.currentMood !== 'soft') return;
                    this.playNote(notes[i % notes.length], 1.5, 'sine', 0.10, 0);
                    this.playNote(notes[(i + 2) % notes.length] / 2, 1.8, 'sine', 0.06, 0.3);
                    i++;
                    this._softTimeout = setTimeout(loop, 1600 + Math.random() * 500);
                };
                loop();
            }

            playBrightMelody() {
                this.currentMood = 'bright';
                const notes = [392.00, 440.00, 493.88, 523.25, 587.33, 523.25, 493.88, 440.00];
                let i = 0;
                const loop = () => {
                    if (!this.isPlaying || this.currentMood !== 'bright') return;
                    this.playChord([notes[i % notes.length], notes[(i + 2) % notes.length]], 2.0, 'triangle',
                        0.09, 0);
                    this.playNote(notes[i % notes.length] * 1.5, 1.2, 'sine', 0.07, 0.2);
                    i++;
                    this._brightTimeout = setTimeout(loop, 1300 + Math.random() * 350);
                };
                loop();
            }

            playNightMelody() {
                this.currentMood = 'night';
                const notes = [196.00, 220.00, 261.63, 293.66, 261.63, 220.00, 196.00, 174.61];
                let i = 0;
                const loop = () => {
                    if (!this.isPlaying || this.currentMood !== 'night') return;
                    this.playNote(notes[i % notes.length], 2.2, 'sine', 0.09, 0);
                    this.playNote(notes[(i + 3) % notes.length] / 2, 2.5, 'sine', 0.05, 0.5);
                    i++;
                    this._nightTimeout = setTimeout(loop, 2000 + Math.random() * 600);
                };
                loop();
            }

            playEndingMelody() {
                this.currentMood = 'ending';
                const chords = [
                    [261.63, 392.00, 523.25],
                    [293.66, 440.00, 587.33],
                    [329.63, 493.88, 659.25],
                    [349.23, 523.25, 698.46],
                    [392.00, 587.33, 783.99],
                ];
                let i = 0;
                const loop = () => {
                    if (!this.isPlaying || this.currentMood !== 'ending') return;
                    this.playChord(chords[i % chords.length], 3.5, 'sine', 0.10, 0);
                    this.playNote(chords[i % chords.length][0], 3.0, 'triangle', 0.12, 0.3);
                    i++;
                    this._endingTimeout = setTimeout(loop, 3500);
                };
                loop();
                // Gradually fade out after some time
                setTimeout(() => {
                    if (this.gainNode && this.currentMood === 'ending') {
                        this.gainNode.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 6);
                    }
                }, 18000);
            }

            setVolume(v) {
                this.volume = v;
                if (this.gainNode) {
                    this.gainNode.gain.value = v;
                }
            }
        }

        const music = new MusicManager();

        // ──────────────────────────────────────────────
        //  GAME CONFIGURATION
        // ──────────────────────────────────────────────
        const GAME_WIDTH = 640;
        const GAME_HEIGHT = 400;

        const config = {
            type: Phaser.AUTO,
            width: GAME_WIDTH,
            height: GAME_HEIGHT,
            parent: 'game-container',
            pixelArt: true,
            roundPixels: true,
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: GAME_WIDTH,
                height: GAME_HEIGHT,
                max: {
                    width: 1280,
                    height: 800,
                },
            },
            backgroundColor: '#000000',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 600 },
                    debug: false,
                },
            },
            scene: [],
        };

        // ──────────────────────────────────────────────
        //  GLOBAL STATE
        // ──────────────────────────────────────────────
        const GameState = {
            playerSpeed: 160,
            normalSpeed: 160,
            slowSpeed: 80,
            verySlowSpeed: 40,
            canMove: true,
            dialogueActive: false,
            currentDialogue: [],
            dialogueIndex: 0,
            nearInteractable: null,
            sceneName: '',
            bridgeFell: false,
            approachingHer: false,
            metHer: false,
        };

        // ──────────────────────────────────────────────
        //  HELPER: Generate pixel textures
        // ──────────────────────────────────────────────
        function createPixelTextures(scene) {
            // --- Player character (16x24 scaled) ---
            const playerGfx = scene.make.graphics({ x: 0, y: 0, add: false });
            // Body (blue shirt)
            playerGfx.fillStyle(0x4488cc);
            playerGfx.fillRect(4, 8, 8, 8);
            // Arms
            playerGfx.fillStyle(0x5599dd);
            playerGfx.fillRect(1, 9, 3, 5);
            playerGfx.fillRect(12, 9, 3, 5);
            // Head
            playerGfx.fillStyle(0xffddaa);
            playerGfx.fillRect(5, 1, 6, 7);
            // Hair
            playerGfx.fillStyle(0x332211);
            playerGfx.fillRect(4, 0, 8, 3);
            playerGfx.fillRect(3, 1, 2, 2);
            // Legs
            playerGfx.fillStyle(0x444466);
            playerGfx.fillRect(5, 16, 3, 6);
            playerGfx.fillRect(9, 16, 3, 6);
            // Shoes
            playerGfx.fillStyle(0x553322);
            playerGfx.fillRect(4, 22, 4, 2);
            playerGfx.fillRect(8, 22, 4, 2);
            // Eyes
            playerGfx.fillStyle(0x000000);
            playerGfx.fillRect(7, 3, 1, 1);
            playerGfx.fillRect(9, 3, 1, 1);
            playerGfx.generateTexture('player', 16, 24);
            playerGfx.destroy();

            // --- Girl character ---
            const girlGfx = scene.make.graphics({ x: 0, y: 0, add: false });
            // Dress (pink/red)
            girlGfx.fillStyle(0xdd6688);
            girlGfx.fillRect(4, 8, 8, 9);
            // Arms
            girlGfx.fillStyle(0xee7799);
            girlGfx.fillRect(1, 9, 3, 5);
            girlGfx.fillRect(12, 9, 3, 5);
            // Head
            girlGfx.fillStyle(0xffddaa);
            girlGfx.fillRect(5, 1, 6, 7);
            // Longer hair
            girlGfx.fillStyle(0x442211);
            girlGfx.fillRect(3, 0, 10, 4);
            girlGfx.fillRect(2, 3, 3, 5);
            girlGfx.fillRect(11, 3, 3, 5);
            // Legs
            girlGfx.fillStyle(0x444466);
            girlGfx.fillRect(5, 17, 3, 5);
            girlGfx.fillRect(9, 17, 3, 5);
            // Shoes
            girlGfx.fillStyle(0x553322);
            girlGfx.fillRect(4, 22, 4, 2);
            girlGfx.fillRect(8, 22, 4, 2);
            // Eyes
            girlGfx.fillStyle(0x000000);
            girlGfx.fillRect(7, 3, 1, 1);
            girlGfx.fillRect(9, 3, 1, 1);
            // Smile
            girlGfx.fillStyle(0xcc5555);
            girlGfx.fillRect(7, 6, 3, 1);
            girlGfx.generateTexture('girl', 16, 24);
            girlGfx.destroy();

            // --- Heart particle ---
            const heartGfx = scene.make.graphics({ x: 0, y: 0, add: false });
            heartGfx.fillStyle(0xff4466);
            heartGfx.fillRect(2, 1, 2, 2);
            heartGfx.fillRect(6, 1, 2, 2);
            heartGfx.fillRect(0, 2, 2, 2);
            heartGfx.fillRect(8, 2, 2, 2);
            heartGfx.fillRect(1, 3, 8, 3);
            heartGfx.fillRect(2, 6, 6, 2);
            heartGfx.fillRect(3, 8, 4, 1);
            heartGfx.fillRect(4, 9, 2, 1);
            heartGfx.generateTexture('heart', 10, 10);
            heartGfx.destroy();

            // --- Firefly glow ---
            const fireflyGfx = scene.make.graphics({ x: 0, y: 0, add: false });
            fireflyGfx.fillStyle(0xffff88, 0.9);
            fireflyGfx.fillCircle(4, 4, 4);
            fireflyGfx.fillStyle(0xffffcc, 0.5);
            fireflyGfx.fillCircle(4, 4, 2);
            fireflyGfx.generateTexture('firefly', 8, 8);
            fireflyGfx.destroy();

            // --- Flower petal ---
            const petalGfx = scene.make.graphics({ x: 0, y: 0, add: false });
            petalGfx.fillStyle(0xff99bb);
            petalGfx.fillRect(1, 0, 3, 2);
            petalGfx.fillRect(0, 1, 5, 3);
            petalGfx.fillRect(1, 4, 3, 2);
            petalGfx.generateTexture('petal', 5, 6);
            petalGfx.destroy();

            // --- Raindrop ---
            const rainGfx = scene.make.graphics({ x: 0, y: 0, add: false });
            rainGfx.fillStyle(0xaaccff, 0.7);
            rainGfx.fillRect(1, 0, 2, 8);
            rainGfx.generateTexture('raindrop', 4, 8);
            rainGfx.destroy();

            // --- Star ---
            const starGfx = scene.make.graphics({ x: 0, y: 0, add: false });
            starGfx.fillStyle(0xffffff, 0.9);
            starGfx.fillRect(1, 0, 1, 3);
            starGfx.fillRect(0, 1, 3, 1);
            starGfx.generateTexture('star', 3, 3);
            starGfx.destroy();

            // --- Leaf ---
            const leafGfx = scene.make.graphics({ x: 0, y: 0, add: false });
            leafGfx.fillStyle(0xcc8844);
            leafGfx.fillRect(1, 0, 3, 2);
            leafGfx.fillRect(0, 2, 5, 3);
            leafGfx.fillRect(1, 5, 3, 1);
            leafGfx.generateTexture('leaf', 5, 6);
            leafGfx.destroy();

            // --- Sparkle ---
            const sparkleGfx = scene.make.graphics({ x: 0, y: 0, add: false });
            sparkleGfx.fillStyle(0xffffff, 0.8);
            sparkleGfx.fillRect(2, 0, 1, 2);
            sparkleGfx.fillRect(0, 2, 1, 1);
            sparkleGfx.fillRect(3, 2, 2, 1);
            sparkleGfx.fillRect(1, 3, 3, 1);
            sparkleGfx.fillRect(2, 4, 1, 1);
            sparkleGfx.generateTexture('sparkle', 5, 5);
            sparkleGfx.destroy();
        }

        // ──────────────────────────────────────────────
        //  DIALOGUE BOX UI
        // ──────────────────────────────────────────────
        function createDialogueBox(scene) {
            const box = scene.add.graphics();
            box.setDepth(100);
            box.setVisible(false);

            const text = scene.add.text(GAME_WIDTH / 2, GAME_HEIGHT - 40, '', {
                fontFamily: 'Georgia, "Times New Roman", serif',
                fontSize: '15px',
                color: '#f5e6d3',
                align: 'center',
                wordWrap: { width: GAME_WIDTH - 80 },
                lineSpacing: 4,
            });
            text.setOrigin(0.5, 0.5);
            text.setDepth(101);
            text.setVisible(false);

            const promptText = scene.add.text(GAME_WIDTH / 2, GAME_HEIGHT - 18, '[Space]', {
                fontFamily: 'Georgia, serif',
                fontSize: '11px',
                color: '#c0a080',
                align: 'center',
            });
            promptText.setOrigin(0.5, 0.5);
            promptText.setDepth(101);
            promptText.setVisible(false);

            return {
                box,
                text,
                promptText,
                show(lines) {
                    GameState.dialogueActive = true;
                    GameState.currentDialogue = Array.isArray(lines) ? lines : [lines];
                    GameState.dialogueIndex = 0;
                    box.clear();
                    box.fillStyle(0x1a1018, 0.88);
                    box.fillRoundedRect(20, GAME_HEIGHT - 85, GAME_WIDTH - 40, 65, 10);
                    box.lineStyle(1, 0x5a4030, 0.7);
                    box.strokeRoundedRect(20, GAME_HEIGHT - 85, GAME_WIDTH - 40, 65, 10);
                    box.setVisible(true);
                    text.setText(GameState.currentDialogue[0]);
                    text.setVisible(true);
                    promptText.setVisible(GameState.currentDialogue.length > 1 || true);
                },
                hide() {
                    GameState.dialogueActive = false;
                    GameState.currentDialogue = [];
                    GameState.dialogueIndex = 0;
                    box.setVisible(false);
                    text.setVisible(false);
                    promptText.setVisible(false);
                },
                advance() {
                    GameState.dialogueIndex++;
                    if (GameState.dialogueIndex < GameState.currentDialogue.length) {
                        text.setText(GameState.currentDialogue[GameState.dialogueIndex]);
                        promptText.setVisible(
                            GameState.dialogueIndex < GameState.currentDialogue.length - 1);
                    } else {
                        this.hide();
                        return true; // finished
                    }
                    return false;
                },
            };
        }

        // ──────────────────────────────────────────────
        //  BOOT SCENE – Generate all textures
        // ──────────────────────────────────────────────
        class BootScene extends Phaser.Scene {
            constructor() {
                super('BootScene');
            }

            create() {
                createPixelTextures(this);
                this.scene.start('OpeningScene');
            }
        }

        // ──────────────────────────────────────────────
        //  OPENING SCENE – Fade in, titles
        // ──────────────────────────────────────────────
        class OpeningScene extends Phaser.Scene {
            constructor() {
                super('OpeningScene');
            }

            create() {
                GameState.sceneName = 'opening';
                this.cameras.main.fadeIn(2000, 0, 0, 0);
                this.cameras.main.setBackgroundColor('#000000');

                music.stopAll();
                music.isPlaying = true;
                music.setVolume(0.22);
                music.playWarmMelody();

                const cx = GAME_WIDTH / 2;
                const cy = GAME_HEIGHT / 2;

                // Soft warm glow
                const glow = this.add.graphics();
                glow.fillStyle(0xff9944, 0.06);
                glow.fillCircle(cx, cy, 180);
                glow.setDepth(0);

                // First line
                const line1 = this.add.text(cx, cy - 30, '', {
                    fontFamily: 'Georgia, "Times New Roman", serif',
                    fontSize: '22px',
                    color: '#f5e0c8',
                    align: 'center',
                });
                line1.setOrigin(0.5);
                line1.setAlpha(0);
                line1.setDepth(2);

                // Second line
                const line2 = this.add.text(cx, cy + 15, '', {
                    fontFamily: 'Georgia, "Times New Roman", serif',
                    fontSize: '16px',
                    color: '#d4b896',
                    align: 'center',
                });
                line2.setOrigin(0.5);
                line2.setAlpha(0);
                line2.setDepth(2);

                // Title
                const title = this.add.text(cx, cy + 60, '', {
                    fontFamily: 'Georgia, "Times New Roman", serif',
                    fontSize: '28px',
                    color: '#ffe0c0',
                    align: 'center',
                    fontStyle: 'italic',
                });
                title.setOrigin(0.5);
                title.setAlpha(0);
                title.setDepth(2);

                // Subtle particles
                const particles = this.add.particles(0, 0, 'sparkle', {
                    x: { min: 0, max: GAME_WIDTH },
                    y: { min: GAME_HEIGHT - 40, max: GAME_HEIGHT },
                    speedY: { min: -25, max: -50 },
                    speedX: { min: -15, max: 15 },
                    alpha: { start: 0.7, end: 0 },
                    scale: { start: 0.6, end: 0 },
                    lifespan: 3000,
                    frequency: 400,
                    quantity: 1,
                    blendMode: 'ADD',
                });
                particles.setDepth(1);

                // Sequence
                this.time.delayedCall(1500, () => {
                    this.tweens.add({
                        targets: line1,
                        alpha: 1,
                        duration: 1500,
                        ease: 'Sine.easeInOut',
                    });
                    line1.setText('"If we could meet..."');
                });

                this.time.delayedCall(4000, () => {
                    this.tweens.add({
                        targets: line1,
                        alpha: 0.3,
                        duration: 800,
                    });
                    this.tweens.add({
                        targets: line2,
                        alpha: 1,
                        duration: 1500,
                        ease: 'Sine.easeInOut',
                    });
                    line2.setText("I'd walk every distance just to be with you.");
                });

                this.time.delayedCall(7000, () => {
                    this.tweens.add({
                        targets: line1,
                        alpha: 0,
                        duration: 600,
                    });
                    this.tweens.add({
                        targets: line2,
                        alpha: 0.4,
                        duration: 600,
                    });
                    this.tweens.add({
                        targets: title,
                        alpha: 1,
                        duration: 2000,
                        ease: 'Sine.easeInOut',
                    });
                    title.setText('If We Could Meet');
                });

                this.time.delayedCall(10500, () => {
                    this.cameras.main.fadeOut(1500, 0, 0, 0);
                });

                this.time.delayedCall(12000, () => {
                    this.scene.start('Scene1');
                });

                // Skip option
                this.input.keyboard.once('keydown-SPACE', () => {
                    this.cameras.main.fadeOut(600, 0, 0, 0);
                    this.time.delayedCall(600, () => {
                        this.scene.start('Scene1');
                    });
                });
            }
        }

        // ──────────────────────────────────────────────
        //  SCENE 1 – The Beginning (Sunset Path)
        // ──────────────────────────────────────────────
        class Scene1 extends Phaser.Scene {
            constructor() {
                super('Scene1');
            }

            create() {
                GameState.sceneName = 'scene1';
                GameState.canMove = true;
                GameState.playerSpeed = GameState.normalSpeed;
                GameState.dialogueActive = false;
                GameState.nearInteractable = null;
                GameState.approachingHer = false;

                this.cameras.main.fadeIn(1200, 0, 0, 0);
                this.cameras.main.setBackgroundColor('#3a2010');

                // --- Sky gradient ---
                const skyGfx = this.add.graphics();
                skyGfx.setDepth(-10);
                for (let i = 0; i < GAME_HEIGHT; i++) {
                    const t = i / GAME_HEIGHT;
                    const r = Math.floor(80 + t * 60);
                    const g = Math.floor(30 + t * 40);
                    const b = Math.floor(60 + t * 50);
                    skyGfx.fillStyle(Phaser.Display.Color.GetColor(r, g, b), 1);
                    skyGfx.fillRect(0, i, GAME_WIDTH, 1);
                }

                // --- Sun ---
                const sunGfx = this.add.graphics();
                sunGfx.setDepth(-9);
                sunGfx.fillStyle(0xffcc66, 0.6);
                sunGfx.fillCircle(520, 70, 50);
                sunGfx.fillStyle(0xffeeaa, 0.35);
                sunGfx.fillCircle(520, 70, 70);

                // --- Distant hills ---
                const hillsGfx = this.add.graphics();
                hillsGfx.setDepth(-8);
                hillsGfx.fillStyle(0x5a6040, 0.7);
                hillsGfx.fillEllipse(150, 250, 350, 160);
                hillsGfx.fillEllipse(420, 260, 400, 150);
                hillsGfx.fillStyle(0x6a7050, 0.6);
                hillsGfx.fillEllipse(300, 270, 500, 140);

                // --- Ground ---
                this.groundY = 310;
                const groundGfx = this.add.graphics();
                groundGfx.setDepth(-5);
                groundGfx.fillStyle(0x7a9a40);
                groundGfx.fillRect(0, this.groundY, GAME_WIDTH, GAME_HEIGHT - this.groundY);
                groundGfx.fillStyle(0x8aaa50);
                groundGfx.fillRect(0, this.groundY, GAME_WIDTH, 6);

                // --- Path ---
                const pathGfx = this.add.graphics();
                pathGfx.setDepth(-4);
                pathGfx.fillStyle(0xb8a070);
                pathGfx.fillRect(0, this.groundY + 4, GAME_WIDTH, 32);
                pathGfx.fillStyle(0xc8b080);
                pathGfx.fillRect(0, this.groundY + 6, GAME_WIDTH, 18);
                // Path texture dots
                for (let x = 0; x < GAME_WIDTH; x += 15) {
                    pathGfx.fillStyle(0xa89060, 0.4);

                // --- Interact prompt ---
                this.interactPrompt = this.add.text(0, 0, '[E] Interact', {

                });

                this.interactPrompt.setDepth(50);
                this.interactPrompt.setVisible(false);

                // --- Controls ---
                this.cursors = this.input.keyboard.createCursorKeys();
                this.keyW = this.input.keyboard.addKey('W');
                this.keyA = this.input.keyboard.addKey('A');
                this.keyS = this.input.keyboard.addKey('S');
                this.keyD = this.input.keyboard.addKey('D');
                this.keyE = this.input.keyboard.addKey('E');
                this.keySpace = this.input.keyboard.addKey('SPACE');

                // --- Auto dialogue trigger distance ---
                this.phoneInteracted = false;
                this.sceneEndTriggered = false;

                // --- Music ---
                music.stopAll();
                music.isPlaying = true;
                music.setVolume(0.22);
                music.playWarmMelody();
            }

            createTree(x, y, scale) {
                const gfx = this.add.graphics();
                gfx.setDepth(-3);
                // Trunk
                gfx.fillStyle(0x6b4433);
                gfx.fillRect(x - 4 * scale, y, 8 * scale, 30 * scale);
                // Canopy
                gfx.fillStyle(0x5a8a30);
                gfx.fillCircle(x, y - 5 * scale, 22 * scale);
                gfx.fillStyle(0x4a7a25);
                gfx.fillCircle(x - 8 * scale, y + 2 * scale, 16 * scale);
                gfx.fillStyle(0x6a9a40);
                gfx.fillCircle(x + 8 * scale, y - 2 * scale, 18 * scale);
            }

            drawPhone(gfx, x, y) {
                // Small pixel phone on a post
                gfx.fillStyle(0x554433);
                gfx.fillRect(x - 3, y - 22, 6, 22);
                gfx.fillStyle(0xcc8844);
                gfx.fillRect(x - 8, y - 26, 16, 10);
                gfx.fillStyle(0x332211);
                gfx.fillRect(x - 5, y - 24, 10, 6);
                gfx.fillStyle(0xeeddcc);
                gfx.fillRect(x - 2, y - 22, 4, 3);
            }

            createBirdFlock() {
                for (let i = 0; i < 4; i++) {
                    const bird = this.add.graphics();
                    bird.setDepth(8);
                    const bx = 100 + i * 120 + Math.random() * 60;
                    const by = 40 + Math.random() * 70;
                    bird.fillStyle(0x332211);
                    bird.fillRect(bx, by, 3, 1);
                    bird.fillRect(bx + 1, by - 1, 1, 2);
                    bird.fillRect(bx - 1, by - 1, 1, 2);
                    this.birds.push({ gfx: bird, x: bx, y: by, speed: 0.3 + Math.random() * 0.5, amplitude: 15 + Math
                            .random() * 20, offset: Math.random() * Math.PI * 2 });
                }
            }

            update(time, delta) {
                if (GameState.dialogueActive) {
                    this.player.setVelocityX(0);
                    return;
                }
                if (!GameState.canMove) {
                    this.player.setVelocityX(0);
                    return;
                }

                // Bird animation
                this.birds.forEach(b => {
                    b.x += b.speed;
                    if (b.x > GAME_WIDTH + 40) b.x = -40;
                    b.y += Math.sin(time * 0.002 + b.offset) * 0.3;
                    b.gfx.clear();
                    b.gfx.fillStyle(0x332211);
                    const wingFlap = Math.sin(time * 0.008 + b.offset) > 0;
                    b.gfx.fillRect(b.x, b.y, 3, 1);
                    if (wingFlap) {
                        b.gfx.fillRect(b.x + 1, b.y - 2, 1, 3);
                        b.gfx.fillRect(b.x - 1, b.y - 2, 1, 3);
                    } else {
                        b.gfx.fillRect(b.x + 1, b.y - 1, 1, 2);
                        b.gfx.fillRect(b.x - 1, b.y - 1, 1, 2);
                    }
                });

                // Player movement
                let vx = 0;
                if (this.cursors.left.isDown || this.keyA.isDown) vx = -GameState.playerSpeed;
                else if (this.cursors.right.isDown || this.keyD.isDown) vx = GameState.playerSpeed;

                this.player.setVelocityX(vx);

                // Flip sprite
                if (vx < 0) this.player.setFlipX(true);
                else if (vx > 0) this.player.setFlipX(false);

                // Check proximity to phone
                const distToPhone = Phaser.Math.Distance.Between(
                    this.player.x, this.player.y, this.phoneX, this.phoneY
                );
                if (distToPhone < 45 && !this.phoneInteracted && !GameState.dialogueActive) {
                    this.interactPrompt.setPosition(this.phoneX, this.phoneY - 40);
                    this.interactPrompt.setVisible(true);
                    GameState.nearInteractable = 'phone';
                } else if (distToPhone >= 45 && GameState.nearInteractable === 'phone') {
                    this.interactPrompt.setVisible(false);
                    GameState.nearInteractable = null;
                }

                // Check if player reached the end
                if (this.player.x > this.worldEndX - 30 && !this.sceneEndTriggered) {
                    this.sceneEndTriggered = true;
                    this.cameras.main.fadeOut(1500, 0, 0, 0);
                    this.time.delayedCall(1500, () => {
                        this.scene.start('Scene2');
                    });
                }

                // E key interaction
                if (Phaser.Input.Keyboard.JustDown(this.keyE) && GameState.nearInteractable === 'phone' && !this
                    .phoneInteracted) {
                    this.phoneInteracted = true;
                    this.interactPrompt.setVisible(false);
                    GameState.canMove = false;
                    this.player.setVelocityX(0);
                    this.dialogueUI.show([
                        'This is where everything began.',
                        'The first message.',
                        'The first smile.',
                        'I never imagined a simple conversation\nwould change my life.',
                    ]);
                }

                // Space to advance dialogue
                if (Phaser.Input.Keyboard.JustDown(this.keySpace) && GameState.dialogueActive) {
                    const finished = this.dialogueUI.advance();
                    if (finished && this.phoneInteracted && !this.sceneEndTriggered) {
                        GameState.canMove = true;
                    }
                }
            }
        }

                if (this.cursors.left.isDown || this.keyA.isDown) vx = -GameState.playerSpeed;
                else if (this.cursors.right.isDown || this.keyD.isDown) vx = GameState.playerSpeed;
                this.player.setVelocityX(vx);
                if (vx < 0) this.player.setFlipX(true);
                else if (vx > 0) this.player.setFlipX(false);

                // Bench proximity
                const distToBench = Phaser.Math.Distance.Between(
                    this.player.x, this.player.y, this.benchX, this.benchY
                );
                if (distToBench < 50 && !this.benchInteracted && !GameState.dialogueActive) {
                    this.interactPrompt.setPosition(this.benchX, this.benchY - 30);
                    this.interactPrompt.setVisible(true);
                    GameState.nearInteractable = 'bench';
                } else if (distToBench >= 50 && GameState.nearInteractable === 'bench') {
                    this.interactPrompt.setVisible(false);
                    GameState.nearInteractable = null;
                }

                if (Phaser.Input.Keyboard.JustDown(this.keyE) && GameState.nearInteractable === 'bench' && !this
                    .benchInteracted) {
                    this.benchInteracted = true;
                    this.interactPrompt.setVisible(false);
                    GameState.canMove = false;
                    this.player.setVelocityX(0);
                    this.dialogueUI.show([
                        'If only we could watch the stars together.',
                        'I wonder what that day will feel like.',
                        "I'll keep believing it'll happen.",
                    ]);
                }

                if (this.player.x > this.worldEndX - 30 && !this.sceneEndTriggered) {
                    this.sceneEndTriggered = true;
                    this.cameras.main.fadeOut(1500, 10, 10, 30);
                    this.time.delayedCall(1500, () => {
                        this.scene.start('Scene4');
                    });
                }

                if (Phaser.Input.Keyboard.JustDown(this.keySpace) && GameState.dialogueActive) {
                    const finished = this.dialogueUI.advance();
                    if (finished && this.benchInteracted) {
                        GameState.canMove = true;
                    }
                }
            }
        }

        // ──────────────────────────────────────────────
        //  SCENE 4 – The Bridge (Light Gameplay)
        // ──────────────────────────────────────────────
        class Scene4 extends Phaser.Scene {
            constructor() {
                super('Scene4');
            }

            create() {
                GameState.sceneName = 'scene4';
                GameState.canMove = true;
                GameState.playerSpeed = GameState.normalSpeed;
                GameState.dialogueActive = false;
                GameState.nearInteractable = null;
                GameState.approachingHer = false;
                GameState.bridgeFell = false;

                this.cameras.main.fadeIn(1000, 20, 20, 40);
                this.cameras.main.setBackgroundColor('#1a1a30');

                // --- Sky ---
                const skyGfx = this.add.graphics();
                skyGfx.setDepth(-10);
                for (let i = 0; i < GAME_HEIGHT; i++) {
                    const t = i / GAME_HEIGHT;
                    skyGfx.fillStyle(Phaser.Display.Color.GetColor(
                        Math.floor(25 + t * 30), Math.floor(20 + t * 25), Math.floor(45 + t * 30)
                    ), 1);
                    skyGfx.fillRect(0, i, GAME_WIDTH, 1);
                }

                // --- Chasm background ---
                this.groundY = 310;
                const cliffGfx = this.add.graphics();
                cliffGfx.setDepth(-5);
                cliffGfx.fillStyle(0x3a3028);
                cliffGfx.fillRect(0, this.groundY, GAME_WIDTH, GAME_HEIGHT - this.groundY);

                // --- Bridge platforms ---
                this.bridgeY = this.groundY - 30;
                this.bridgePlatforms = [];
                const platformData = [
                    { x: 60, w: 90 },
                    { x: 175, w: 70 },
                    { x: 270, w: 60 },
                    { x: 355, w: 55 },
                    { x: 435, w: 65 },
                    { x: 525, w: 80 },
                    { x: 630, w: 70 },
                ];

                platformData.forEach((p, i) => {
                    const plat = this.add.graphics();
                    plat.setDepth(2);
                    plat.fillStyle(0x7a5a3a);
                    plat.fillRect(p.x, this.bridgeY, p.w, 8);
                    plat.fillStyle(0x8a6a4a);
                    plat.fillRect(p.x, this.bridgeY, p.w, 3);
                    // Wood grain
                    for (let gx = p.x + 4; gx < p.x + p.w - 4; gx += 8) {
                        plat.fillStyle(0x6a4a2a, 0.5);
                        plat.fillRect(gx, this.bridgeY + 5, 3, 2);
                    }
                    // Railing posts
                    if (i > 0 && i < platformData.length - 1) {
                        plat.fillStyle(0x5a3a20);
                        plat.fillRect(p.x - 2, this.bridgeY - 14, 3, 14);
                        plat.fillRect(p.x + p.w - 1, this.bridgeY - 14, 3, 14);
                    }
                    this.bridgePlatforms.push({
                        x: p.x,
                        y: this.bridgeY,
                        width: p.w,
                        gfx: plat,
                    });
                });

                // --- Rope lines between platforms ---
                const ropeGfx = this.add.graphics();
                ropeGfx.setDepth(1);
                ropeGfx.lineStyle(1, 0x998877, 0.6);
                for (let i = 0; i < this.bridgePlatforms.length - 1; i++) {
                    const p1 = this.bridgePlatforms[i];
                    const p2 = this.bridgePlatforms[i + 1];
                    ropeGfx.beginPath();
                    ropeGfx.moveTo(p1.x + p1.width, p1.y - 10);
                    ropeGfx.lineTo(p2.x, p2.y - 10);
                    ropeGfx.strokePath();
                }

                // --- Gap markers (visual only) ---
                const gapGfx = this.add.graphics();
                gapGfx.setDepth(-1);
                for (let i = 0; i < this.bridgePlatforms.length - 1; i++) {
                    const p1 = this.bridgePlatforms[i];
                    const p2 = this.bridgePlatforms[i + 1];
                    const gapStart = p1.x + p1.width;
                    const gapEnd = p2.x;
                    gapGfx.fillStyle(0x0a0a15, 0.5);
                    gapGfx.fillRect(gapStart, this.bridgeY - 5, gapEnd - gapStart, 50);
                }

                // --- Fog/mist in the chasm ---
                const mistGfx = this.add.graphics();
                mistGfx.setDepth(0);
                mistGfx.fillStyle(0x8899aa, 0.15);
                mistGfx.fillRect(0, this.bridgeY + 10, GAME_WIDTH, 60);

                // --- Player ---
                this.player = this.physics.add.sprite(40, this.bridgeY - 14, 'player');
                this.player.setScale(3);
                this.player.setDepth(10);
                this.player.setCollideWorldBounds(false);
                this.player.body.setSize(10, 18);
                this.player.body.setOffset(3, 4);
                this.player.setOrigin(0.5, 1);
                this.player.body.setAllowGravity(true);

                // --- Ground level (safety net - invisible floor far below) ---
                this.safetyY = this.bridgeY + 80;
                this.safetyZone = this.add.zone(GAME_WIDTH / 2, this.safetyY, GAME_WIDTH, 10);
                this.physics.world.enable(this.safetyZone);
                this.safetyZone.body.setAllowGravity(false);
                this.safetyZone.body.setImmovable(true);

                // --- World ---
                this.worldEndX = 720;
                this.physics.world.setBounds(0, 0, this.worldEndX, GAME_HEIGHT + 100);
                this.cameras.main.setBounds(0, 0, this.worldEndX, GAME_HEIGHT);
                this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
                this.cameras.main.setFollowOffset(0, 15);

                // --- Dialogue ---
                this.dialogueUI = createDialogueBox(this);
                this.midDialogueShown = false;
                this.sceneEndTriggered = false;
                this.playerFell = false;

                // --- Controls ---
                this.cursors = this.input.keyboard.createCursorKeys();
                this.keyA = this.input.keyboard.addKey('A');
                this.keyD = this.input.keyboard.addKey('D');
                this.keyW = this.input.keyboard.addKey('W');
                this.keySpace = this.input.keyboard.addKey('SPACE');
                this.keyUp = this.input.keyboard.addKey('UP');

                // --- Music ---
                music.stopAll();
                music.isPlaying = true;
                music.setVolume(0.17);
                music.playSoftMelody();

                // --- Bridge shake timer ---
                this.bridgeShakeTime = 0;
                this.bridgeShaking = false;
            }

            update(time, delta) {
                if (GameState.dialogueActive) {
                    this.player.setVelocityX(0);
                    return;
                }
                if (!GameState.canMove) {
                    this.player.setVelocityX(0);
                    return;
                }

                // Check if player fell
                if (this.player.y > this.bridgeY + 55 && !this.playerFell) {
                    this.playerFell = true;
                    // Soft reset
                    this.cameras.main.fadeOut(400, 20, 20, 40);
                    this.time.delayedCall(400, () => {
                        this.player.setPosition(40, this.bridgeY - 14);
                        this.player.setVelocity(0, 0);
                        this.playerFell = false;
                        this.cameras.main.fadeIn(400, 20, 20, 40);
                    });
                }

                // Mid-bridge dialogue trigger
                if (this.player.x > 280 && !this.midDialogueShown) {
                    this.midDialogueShown = true;
                    GameState.canMove = false;
                    this.player.setVelocityX(0);
                    this.bridgeShaking = true;
                    this.bridgeShakeTime = time;
                    this.dialogueUI.show([
                        'Some days are difficult.',
                        'I get scared.',
                        'I overthink.',
                        'But leaving you behind was never\none of my choices.',
                    ]);
                }

                // Bridge shake effect
                if (this.bridgeShaking && time - this.bridgeShakeTime < 3000) {
                    const shakeX = Math.sin(time * 0.02) * 2;
                    this.cameras.main.setFollowOffset(shakeX, 15);
                } else if (this.bridgeShaking && time - this.bridgeShakeTime >= 3000) {
                    this.bridgeShaking = false;
                    this.cameras.main.setFollowOffset(0, 15);
                }

                let vx = 0;
                if (this.cursors.left.isDown || this.keyA.isDown) vx = -GameState.playerSpeed;
                else if (this.cursors.right.isDown || this.keyD.isDown) vx = GameState.playerSpeed;
                this.player.setVelocityX(vx);
                if (vx < 0) this.player.setFlipX(true);
                else if (vx > 0) this.player.setFlipX(false);

                // Jump
                const jumpPressed = Phaser.Input.Keyboard.JustDown(this.keyUp) ||
                    Phaser.Input.Keyboard.JustDown(this.keyW) ||
                    Phaser.Input.Keyboard.JustDown(this.keySpace);
                if (jumpPressed && this.isPlayerOnAnyPlatform()) {
                    this.player.setVelocityY(-280);
                }

                // End of scene
                if (this.player.x > this.worldEndX - 20 && !this.sceneEndTriggered) {
                    this.sceneEndTriggered = true;
                    this.cameras.main.fadeOut(1500, 20, 20, 40);
                    this.time.delayedCall(1500, () => {
                        this.scene.start('Scene5');
                    });
                }

                if (Phaser.Input.Keyboard.JustDown(this.keySpace) && GameState.dialogueActive) {
                    const finished = this.dialogueUI.advance();
                    if (finished && this.midDialogueShown) {
                        GameState.canMove = true;
                    }
                }
            }

            isPlayerOnAnyPlatform() {
                for (const plat of this.bridgePlatforms) {
                    const px = this.player.x;
                    const py = this.player.y;
                    if (
                        px > plat.x - 5 &&
                        px < plat.x + plat.width + 5 &&
                        py >= plat.y - 18 &&
                        py <= plat.y + 6 &&
                        this.player.body.velocity.y >= -10
                    ) {
                        // Snap to platform
                        this.player.y = plat.y - 14;
                        this.player.setVelocityY(0);
                        return true;
                    }
                }
                return false;
            }
        }

                this.cameras.main.setBounds(0, 0, GAME_WIDTH, GAME_HEIGHT);
                this.cameras.main.startFollow(this.player, true, 0.06, 0.06);
                this.cameras.main.setFollowOffset(0, 15);

                this.sceneTransitioning = false;

                this.keyA = this.input.keyboard.addKey('A');
                this.keyD = this.input.keyboard.addKey('D');
                this.keySpace = this.input.keyboard.addKey('SPACE');

                music.isPlaying = true;
                music.setVolume(0.24);
                music.playBrightMelody();
            }

            update(time, delta) {
                if (GameState.dialogueActive || this.sceneTransitioning) {
                    this.player.setVelocityX(0);
                    return;
                }
                if (!GameState.canMove) {
                    this.player.setVelocityX(0);
                    return;
                }

                // Distance to girl
                const distToGirl = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.girlX, this.girlY);

                // Slow down as we get closer
                if (distToGirl < 180 && !GameState.approachingHer) {
                    GameState.approachingHer = true;
                    GameState.playerSpeed = GameState.verySlowSpeed;
                }
                if (distToGirl < 70 && !this.approachStarted) {
                    this.approachStarted = true;
                    GameState.playerSpeed = 25;
                }

                // When close enough, trigger the meeting
                if (distToGirl < 50 && !this.sceneTransitioning && !GameState.metHer) {
                    this.triggerMeeting();
                    return;
                }

                let vx = 0;
                if (this.cursors.left.isDown || this.keyA.isDown) vx = -GameState.playerSpeed;
                else if (this.cursors.right.isDown || this.keyD.isDown) vx = GameState.playerSpeed;
                this.player.setVelocityX(vx);
                if (vx < 0) this.player.setFlipX(true);
                else if (vx > 0) this.player.setFlipX(false);

                // Gentle girl idle animation
                if (this.girlSprite && !GameState.metHer) {
                    this.girlSprite.y = this.girlY + Math.sin(time * 0.002) * 1.5;
                }
            }

            triggerMeeting() {
                GameState.metHer = true;
                GameState.canMove = false;
                this.sceneTransitioning = true;
                this.player.setVelocityX(0);
                this.player.setVelocityY(0);

                // Disable controls message
                this.time.delayedCall(300, () => {
                    this.scene.start('FinalScene');
                });
            }
        }

                        this.cameras.main.flash(2000, 255, 250, 240, true);

                        // Music becomes softer
                        music.setVolume(0.14);
                    });
                });

                // Fade to white
                this.time.delayedCall(7500, () => {
                    this.cameras.main.fadeOut(2500, 255, 255, 255);
                });

                this.time.delayedCall(10000, () => {
                    this.scene.start('LetterScene');
                });
            }
        }

        // ──────────────────────────────────────────────
        //  LETTER SCENE
        // ──────────────────────────────────────────────
        class LetterScene extends Phaser.Scene {
            constructor() {
                super('LetterScene');
            }

            create() {
                GameState.sceneName = 'letter';
                this.cameras.main.fadeIn(1500, 255, 255, 255);
                this.cameras.main.setBackgroundColor('#faf8f0');

                const cx = GAME_WIDTH / 2;

                // Paper texture background
                const paperGfx = this.add.graphics();
                paperGfx.setDepth(0);
                paperGfx.fillStyle(0xfdfaf2, 1);
                paperGfx.fillRect(30, 15, GAME_WIDTH - 60, GAME_HEIGHT - 30);
                paperGfx.lineStyle(1, 0xe0d5c0, 0.6);
                paperGfx.strokeRect(30, 15, GAME_WIDTH - 60, GAME_HEIGHT - 30);
                // Subtle lines
                for (let y = 40; y < GAME_HEIGHT - 30; y += 20) {
                    paperGfx.fillStyle(0xe8e0d0, 0.4);
                    paperGfx.fillRect(50, y, GAME_WIDTH - 100, 1);
                }

                const letterLines = [
                    'Happy 17 Months, my love.',
                    '',
                    'If I had the chance, I would cross every distance,',
                    'face every obstacle, and wait through every season',
                    'just to reach you.',
                    '',
                    "Even though we can't always be together physically,",
                    "you've never felt far from my heart.",
                    '',
                    'Thank you for every laugh, every late-night',
                    'conversation, every memory we\'ve made,',
                    "and every day you've continued choosing us.",
                    '',
                    'No matter how many kilometers separate us,',
                    "I'll keep walking toward you.",
                    '',
                    'And if one day we finally meet...',
                    'I know every step will have been worth it.',
                    '',
                    'Thank you for being my favorite person.',
                    '',
                    'Happy 17 Months.',
                    'I love you.',
                ];

                const letterText = this.add.text(cx, 38, letterLines.join('\n'), {
                    fontFamily: 'Georgia, "Times New Roman", serif',
                    fontSize: '12px',
                    color: '#3a2a1a',
                    align: 'left',
                    lineSpacing: 5,
                    wordWrap: { width: GAME_WIDTH - 120 },
                });
                letterText.setOrigin(0.5, 0);
                letterText.setDepth(2);
                letterText.setAlpha(0);

                // Fade in letter
                this.tweens.add({
                    targets: letterText,
                    alpha: 1,
                    duration: 2000,
                    ease: 'Sine.easeInOut',
                    delay: 500,
                });

                // Continue button
                const btnY = GAME_HEIGHT - 45;
                const btnGfx = this.add.graphics();
                btnGfx.setDepth(3);
                btnGfx.fillStyle(0xd4a080, 1);
                btnGfx.fillRoundedRect(cx - 50, btnY - 16, 100, 32, 8);
                btnGfx.lineStyle(1, 0xb08060, 0.8);
                btnGfx.strokeRoundedRect(cx - 50, btnY - 16, 100, 32, 8);

                const btnText = this.add.text(cx, btnY, 'Continue', {
                    fontFamily: 'Georgia, serif',
                    fontSize: '14px',
                    color: '#fdfaf5',
                    align: 'center',
                });
                btnText.setOrigin(0.5);
                btnText.setDepth(4);

                // Make button interactive
                const btnZone = this.add.zone(cx, btnY, 100, 32);
                btnZone.setInteractive({ useHandCursor: true });
                btnZone.setDepth(5);
                btnZone.on('pointerover', () => {
                    btnGfx.clear();
                    btnGfx.fillStyle(0xe0b090, 1);
                    btnGfx.fillRoundedRect(cx - 50, btnY - 16, 100, 32, 8);
                    btnGfx.lineStyle(1, 0xc09070, 0.9);
                    btnGfx.strokeRoundedRect(cx - 50, btnY - 16, 100, 32, 8);
                });
                btnZone.on('pointerout', () => {
                    btnGfx.clear();
                    btnGfx.fillStyle(0xd4a080, 1);
                    btnGfx.fillRoundedRect(cx - 50, btnY - 16, 100, 32, 8);
                    btnGfx.lineStyle(1, 0xb08060, 0.8);
                    btnGfx.strokeRoundedRect(cx - 50, btnY - 16, 100, 32, 8);
                });
                btnZone.on('pointerdown', () => {
                    this.cameras.main.fadeOut(1000, 255, 255, 255);
                    this.time.delayedCall(1000, () => {
                        this.scene.start('EndingScene');
                    });
                });

                // Also allow Space to continue
                this.input.keyboard.once('keydown-SPACE', () => {
                    this.cameras.main.fadeOut(1000, 255, 255, 255);
                    this.time.delayedCall(1000, () => {
                        this.scene.start('EndingScene');
                    });
                });

                // Music
                music.stopAll();
                music.isPlaying = true;
                music.setVolume(0.15);
                music.playEndingMelody();
            }
        }

        // ──────────────────────────────────────────────
        //  ENDING SCENE – Under the Tree
        // ──────────────────────────────────────────────
        class EndingScene extends Phaser.Scene {
            constructor() {
                super('EndingScene');
            }

            create() {
                GameState.sceneName = 'ending';
                GameState.canMove = false;

                this.cameras.main.fadeIn(2000, 0, 0, 0);
                this.cameras.main.setBackgroundColor('#1a1020');

                const cx = GAME_WIDTH / 2;
                const groundY = 300;

                // --- Sunset sky ---
                const skyGfx = this.add.graphics();
                skyGfx.setDepth(-10);
                for (let i = 0; i < GAME_HEIGHT; i++) {
                    const t = i / GAME_HEIGHT;
                    skyGfx.fillStyle(Phaser.Display.Color.GetColor(
                        Math.floor(40 + t * 25),
                        Math.floor(15 + t * 20),
                        Math.floor(35 + t * 30)
                    ), 1);
                    skyGfx.fillRect(0, i, GAME_WIDTH, 1);
                }

                // --- Large tree ---
                const treeGfx = this.add.graphics();
                treeGfx.setDepth(2);
                // Trunk
                treeGfx.fillStyle(0x4a3028);
                treeGfx.fillRect(cx - 14, groundY - 90, 28, 90);
                treeGfx.fillStyle(0x5a4035);
                treeGfx.fillRect(cx - 8, groundY - 85, 16, 80);
                // Roots
                treeGfx.fillStyle(0x3a2520);
                treeGfx.fillRect(cx - 22, groundY - 8, 44, 8);
                // Canopy
                treeGfx.fillStyle(0x2a4a20);
                treeGfx.fillCircle(cx, groundY - 105, 55);
                treeGfx.fillStyle(0x1a3a15);
                treeGfx.fillCircle(cx - 25, groundY - 90, 38);
                treeGfx.fillStyle(0x355a28);
                treeGfx.fillCircle(cx + 22, groundY - 95, 42);
                treeGfx.fillStyle(0x2a5022);
                treeGfx.fillCircle(cx, groundY - 115, 35);

                // --- Ground ---
                const groundGfx = this.add.graphics();
                groundGfx.setDepth(-5);
                groundGfx.fillStyle(0x3a4a28);
                groundGfx.fillRect(0, groundY, GAME_WIDTH, GAME_HEIGHT - groundY);
                groundGfx.fillStyle(0x4a5a35);
                groundGfx.fillRect(0, groundY, GAME_WIDTH, 4);

                // --- Characters sitting ---
                const sitY = groundY - 6;
                this.playerSprite = this.add.sprite(cx - 18, sitY, 'player');
                this.playerSprite.setScale(2.8);
                this.playerSprite.setDepth(5);
                this.playerSprite.setOrigin(0.5, 1);

                this.girlSprite = this.add.sprite(cx + 18, sitY, 'girl');
                this.girlSprite.setScale(2.8);
                this.girlSprite.setDepth(5);
                this.girlSprite.setOrigin(0.5, 1);

                // --- Fireflies ---
                this.fireflyParticles = this.add.particles(0, 0, 'firefly', {
                    x: { min: cx - 120, max: cx + 120 },
                    y: { min: groundY - 140, max: groundY + 30 },
                    speedY: { min: -12, max: 12 },
                    speedX: { min: -18, max: 18 },
                    alpha: { start: 0.85, end: 0 },
                    scale: { start: 0.7, end: 0.2 },
                    lifespan: 3500,
                    frequency: 250,
                    quantity: 1,
                    blendMode: 'ADD',
                });
                this.fireflyParticles.setDepth(6);

                // --- Sparkles ---
                this.sparkleParticles = this.add.particles(0, 0, 'sparkle', {
                    x: { min: cx - 100, max: cx + 100 },
                    y: { min: groundY - 130, max: groundY - 20 },
                    speedY: { min: -8, max: 8 },
                    speedX: { min: -10, max: 10 },
                    alpha: { start: 0.7, end: 0 },
                    scale: { start: 0.5, end: 0 },
                    lifespan: 2500,
                    frequency: 500,
                    quantity: 1,
                    blendMode: 'ADD',
                });
                this.sparkleParticles.setDepth(7);

                // --- Gentle wind (petals) ---
                this.windPetals = this.add.particles(0, 0, 'petal', {
                    x: { min: 0, max: GAME_WIDTH },
                    y: { min: -10, max: GAME_HEIGHT },
                    speedY: { min: 5, max: 20 },
                    speedX: { min: 15, max: 35 },
                    rotate: { min: 0, max: 360 },
                    alpha: { start: 0.7, end: 0 },
                    scale: { start: 0.8, end: 0.2 },
                    lifespan: 12000,
                    frequency: 800,
                    quantity: 1,
                });
                this.windPetals.setDepth(4);

                // --- Subtle idle animations ---
                this.tweens.add({
                    targets: this.playerSprite,
                    y: sitY - 1,
                    duration: 2500,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut',
                });
                this.tweens.add({
                    targets: this.girlSprite,
                    y: sitY - 1.5,
                    duration: 2800,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut',
                });

                // --- Text sequence ---
                const textStyle = {
                    fontFamily: 'Georgia, "Times New Roman", serif',
                    fontSize: '17px',
                    color: '#f0e0d0',
                    align: 'center',
                };

                const text1 = this.add.text(cx, groundY + 50, '', textStyle);
                text1.setOrigin(0.5);
                text1.setDepth(10);
                text1.setAlpha(0);

                const text2 = this.add.text(cx, groundY + 75, '', {
                    ...textStyle,
                    fontSize: '15px',
                    color: '#d8c8b8'
                });
                text2.setOrigin(0.5);
                text2.setDepth(10);
                text2.setAlpha(0);

                const text3 = this.add.text(cx, groundY + 100, '', {
                    ...textStyle,
                    fontSize: '14px',
                    color: '#e8c0c0',
                    fontStyle: 'italic',
                });
                text3.setOrigin(0.5);
                text3.setDepth(10);
                text3.setAlpha(0);

                // Sequence
                this.time.delayedCall(2000, () => {
                    this.tweens.add({
                        targets: text1,
                        alpha: 1,
                        duration: 1500,
                    });
                    text1.setText('Distance never stopped me from choosing you.');
                });

                this.time.delayedCall(5500, () => {
                    this.tweens.add({
                        targets: text2,
                        alpha: 1,
                        duration: 1500,
                    });
                    text2.setText('Our story is still being written...');
                });

                this.time.delayedCall(9000, () => {
                    this.tweens.add({
                        targets: text3,
                        alpha: 1,
                        duration: 1800,
                    });
                    text3.setText('Loading...\nMonth 18 ❤️');
                });

                // Fade to black
                this.time.delayedCall(14000, () => {
                    music.setVolume(0.06);
                    this.cameras.main.fadeOut(4000, 0, 0, 0);
                });

                this.time.delayedCall(18500, () => {
                    music.stopAll();
                    music.isPlaying = false;
                    // Show final message on black
                    const finalText = this.add.text(cx, GAME_HEIGHT / 2, '♡', {
                        fontFamily: 'Georgia, serif',
                        fontSize: '40px',
                        color: '#ff8888',
                        align: 'center',
                    });
                    finalText.setOrigin(0.5);
                    finalText.setDepth(20);
                    finalText.setAlpha(0);
                    this.tweens.add({
                        targets: finalText,
                        alpha: 1,
                        duration: 2000,
                    });
                    this.tweens.add({
                        targets: finalText,
                        alpha: 0,
                        duration: 3000,
                        delay: 3000,
                    });
                });

                // Music
                music.stopAll();
                music.isPlaying = true;
                music.setVolume(0.14);
                music.playEndingMelody();
            }
        }

        // ──────────────────────────────────────────────
        //  ASSEMBLE GAME
        // ──────────────────────────────────────────────
        config.scene = [
            BootScene,
            OpeningScene,
            Scene1,
            Scene2,
            Scene3,
            Scene4,
            Scene5,
            FinalScene,
            LetterScene,
            EndingScene,
        ];

        const game = new Phaser.Game(config);

        // Handle first user interaction for audio
        document.addEventListener('click', () => {
            music.resume();
        }, { once: true });
        document.addEventListener('keydown', () => {
            music.resume();
        }, { once: true });

        console.log('🌙 "If We Could Meet" - A pixel story game');
        console.log('💛 Use Arrow Keys or WASD to move');
        console.log('📱 Press E to interact with objects');
        console.log('💬 Press Space to continue dialogue');
        console.log('✨ Enjoy the journey...');
    </script>
</body>
</html>
